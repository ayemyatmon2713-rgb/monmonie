<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DREAMIEZ · Saturn Rush</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;600;800&display=swap');
:root{--accent:#ff8bd4}*{box-sizing:border-box}body{margin:0;background:#0d1031;color:#fff;font-family:'Noto Sans KR',sans-serif;background-image:radial-gradient(ellipse at 80% 20%,#402b6855,transparent 60%);min-height:100vh}button,a{font:inherit}button{cursor:pointer}body:before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.6;background-image:radial-gradient(1px 1px at 20px 30px,white 90%,transparent),radial-gradient(2px 2px at 100px 120px,#d8bfff 90%,transparent);background-size:160px 170px,290px 270px;animation:stars 24s linear infinite}header{position:relative;max-width:1400px;margin:auto;padding:30px 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff18}.brand{font:26px 'Jua';letter-spacing:1px}.brand span{color:#ffdc87}small,.eyebrow{font-size:11px;letter-spacing:3px;color:#b9b8d4}.motion{border:1px solid #ffffff30;border-radius:30px;padding:10px 16px;color:#dedaf6;background:#ffffff08}main{position:relative;max-width:1400px;margin:auto;padding:38px 5% 70px}.intro h1{font:clamp(36px,5vw,64px)/1.1 'Jua';margin:12px 0}.intro h1 em{font-style:normal;color:#ffd687}.intro p{color:#bdbbd8;font-size:14px}.layout{display:grid;grid-template-columns:1.02fr 1fr;gap:48px;margin-top:40px;align-items:center}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:center}.card{position:relative;padding:7px 7px 14px;border:1px solid #ffffff36;border-radius:20px;background:linear-gradient(150deg,#ffffff18,#ffffff06);color:#fff;transition:transform .25s,box-shadow .25s;animation:float 4s ease-in-out infinite;animation-delay:calc(var(--i)*-.4s)}.card:nth-child(n+5){transform:translateX(45%)}.card:hover{box-shadow:0 0 30px #b69bff55}.card[aria-pressed=true]{border:2px solid var(--c);box-shadow:0 0 25px color-mix(in srgb,var(--c) 50%,transparent)}.card .picture{aspect-ratio:1/1.1;border-radius:14px;overflow:hidden;background:#e6e0f5}.picture img{width:100%;height:100%;object-fit:cover;object-position:25% center;transform:none}.card b{display:block;font:19px 'Jua';margin-top:12px}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--c);margin-right:6px}.number{position:absolute;top:13px;left:14px;color:#34304e;font-size:10px;z-index:1}.selected-label{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--c);color:#26143b;border-radius:12px;padding:3px 9px;font-size:9px;white-space:nowrap;font-weight:800}.stage{position:relative;min-width:0;padding:28px;border:1px solid #ffffff20;border-radius:32px;background:radial-gradient(ellipse at 50% 35%,#62529444,transparent 65%),#ffffff04}.stage-top{display:flex;justify-content:space-between;align-items:center}.badge{font-size:10px;letter-spacing:2px;color:var(--accent)}.counter{color:#8f8bab;font-size:11px}.art{position:relative;margin:20px 0;aspect-ratio:1.28;display:grid;place-items:center}.art:after{content:'';position:absolute;bottom:5%;width:60%;height:15%;background:var(--accent);filter:blur(45px);opacity:.18;z-index:-1}.hero-image{width:100%;height:100%;object-fit:contain;border-radius:22px;animation:float 5s ease-in-out infinite;transition:opacity .2s}.name-line{display:flex;align-items:center;gap:15px}.name-line h2{font:44px 'Jua';margin:0;color:var(--accent)}.name-line span{font-size:11px;border:1px solid #ffffff25;padding:5px 10px;border-radius:20px;color:#ccc7e5}.description{font-size:14px;color:#c7c3dd;line-height:1.9;min-height:54px}.controls{display:flex;gap:8px;flex-wrap:wrap}.tab{border:1px solid #ffffff25;background:transparent;color:#b9b4d1;border-radius:12px;padding:10px 15px;font-size:12px}.tab[aria-pressed=true]{background:#ffffff14;color:white;border-color:var(--accent)}.download{display:block;text-decoration:none;text-align:center;background:var(--accent);color:#221530;padding:15px;border-radius:14px;font-weight:800;margin-top:16px;font-size:13px}.foot{display:flex;justify-content:space-between;gap:15px;margin-top:35px;color:#8f8baa;font-size:11px;line-height:1.8}.route{letter-spacing:1px;color:#d9c7ef}.status{margin-top:28px;font-size:11px;color:#a8a0c5}.paused *, .paused:before{animation-play-state:paused!important}@keyframes float{0%,100%{translate:0 0}50%{translate:0 -9px}}@keyframes stars{to{background-position:0 170px,0 270px}}@media(max-width:850px){.layout{grid-template-columns:1fr;gap:36px}.grid{max-width:570px;width:100%;margin:auto}.stage{max-width:570px;width:100%;margin:auto}.intro{text-align:center}.foot{flex-direction:column}.card b{font-size:16px}header{padding:22px 5%}.brand{font-size:20px}}@media(prefers-reduced-motion:reduce){*,body:before{animation:none!important}}
</style><link rel="stylesheet" href="game.css?v=mobile3"></head><body><header><div class="brand">DREAMIEZ <span>✦</span> SATURN RUSH</div><button class="motion" id="motion" aria-pressed="false">Ⅱ 모션 멈추기</button></header><main><section class="intro"><div class="eyebrow">MEET YOUR SPACE CREW</div><h1>토성까지 함께할<br><em>나의 파일럿</em>을 골라요.</h1><p>일곱 친구와 함께하는 약 30초의 스피드 레이스! 캐릭터를 고르고 바로 출발하세요.</p></section><div class="layout"><div><div class="grid" id="cards"></div><p class="status">✦ 7 PILOTS &nbsp; / &nbsp; 동일한 기본 성능 · 서로 다른 스타일</p></div><section class="stage" aria-label="선택한 캐릭터 소개"><div class="stage-top"><span class="badge">● SELECTED PILOT</span><span class="counter" id="counter"></span></div><div class="art"><img class="hero-image" id="hero" alt=""></div><div class="name-line"><h2 id="name"></h2><span id="color"></span></div><p class="description" id="desc"></p><div class="controls"><button class="tab" data-mode="pair" aria-pressed="true">함께 보기</button><button class="tab" data-mode="character" aria-pressed="false">캐릭터</button><button class="tab" data-mode="ship" aria-pressed="false">우주선</button></div><a class="download" id="download" download>↓ 개별 이미지 다운로드</a></section></div><footer class="foot"><span class="route">EARTH &nbsp; → &nbsp; MARS &nbsp; → &nbsp; JUPITER &nbsp; → &nbsp; SATURN</span><span>캐릭터 소개 · 애니메이션 미리보기<br>레이스 플레이는 다음 제작 단계입니다.</span></footer></main>
<script>
const pilots=[['eong','#ffd570','선샤인 옐로','작은 별처럼 밝은 친구. 노란 우주선과 함께 지구의 출발선을 환하게 밝혀요.'],['jjun','#ffab72','코스믹 오렌지','귀를 쫑긋 세운 주황빛 친구. 새로운 행성을 발견할 때마다 모험을 꿈꿔요.'],['jjed','#8cdeff','스타라이트 블루','구름처럼 포근한 하얀 친구. 하늘빛 우주선에 올라 은하수 여행을 준비해요.'],['jjopoo','#ff8996','메테오 레드','호기심 가득한 갈색 친구. 빨간 우주선과 함께 소행성 사이로 떠나요.'],['kkyuping','#ff9bda','오로라 핑크','긴 귀를 살랑이는 분홍 친구. 핑크빛 우주선으로 토성의 고리를 만나러 가요.'],['lemyo','#bd9aff','네뷸라 퍼플','느긋한 표정의 회색 고양이. 보랏빛 우주선에서 반짝이는 우주를 감상해요.'],['bamjji','#b9e58b','오빗 그린','동글동글 사랑스러운 친구. 초록 우주선과 함께 즐거운 우주 여행을 시작해요.']];
let selected=4,mode='pair';const $=s=>document.querySelector(s);function file(){return `assets/${pilots[selected][0]}${mode==='pair'?'.png':'-'+mode+'.svg'}`};
pilots.forEach((p,i)=>{const b=document.createElement('button');b.className='card';b.style.cssText=`--c:${p[1]};--i:${i}`;b.setAttribute('aria-label',p[0]+' 선택');b.innerHTML=`<span class="number">0${i+1}</span><div class="picture"><img src="assets/${p[0]}-character.svg" alt="${p[0]} 캐릭터"></div><b><span class="dot"></span>${p[0]}</b>`;b.onclick=()=>{selected=i;render()};$('#cards').append(b)});
function render(){const p=pilots[selected];document.documentElement.style.setProperty('--accent',p[1]);$('#name').textContent=p[0];$('#color').textContent=p[2];$('#desc').textContent=p[3];$('#counter').textContent=`0${selected+1} / 07`;$('#hero').src=file();$('#hero').alt=p[0]+(mode==='pair'?' 캐릭터와 우주선':mode==='ship'?' 우주선':' 캐릭터');$('#download').href=file();$('#download').download=p[0]+'-'+mode+(mode==='pair'?'.png':'.svg');document.querySelectorAll('.card').forEach((b,i)=>{b.setAttribute('aria-pressed',i===selected);b.querySelector('.selected-label')?.remove();if(i===selected){const tag=document.createElement('span');tag.className='selected-label';tag.textContent='★ PLAYER';b.append(tag)}});document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode))}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});$('#motion').onclick=()=>{const paused=document.body.classList.toggle('paused');$('#motion').textContent=paused?'▶ 모션 재생':'Ⅱ 모션 멈추기';$('#motion').setAttribute('aria-pressed',paused)};render();
</script><script src="race-engine.js?v=mobile3"></script><script src="game.js?v=mobile3"></script></body></html>
